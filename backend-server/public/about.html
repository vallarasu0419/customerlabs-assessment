<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customerlabs Action Recorder Widget - About</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .instructions {
      background-color: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 20px;
      margin: 20px 0;
      border-radius: 4px;
    }

    .instructions h3 {
      margin-top: 0;
      color: #667eea;
    }

    .instructions ol {
      margin: 10px 0;
      padding-left: 20px;
    }

    .instructions li {
      margin: 8px 0;
    }

    .url-examples {
      background-color: #e7f3ff;
      padding: 15px;
      border-radius: 4px;
      margin: 10px 0;
    }

    .url-examples code {
      background-color: #fff;
      padding: 4px 8px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      color: #d63384;
      display: block;
      margin: 5px 0;
    }

    .demo-content {
      margin-top: 40px;
    }

    .demo-content h2 {
      color: #333;
    }

    .demo-content p {
      line-height: 1.6;
      color: #666;
    }

    .button {
      background-color: #667eea;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 10px 10px 0;
      transition: background-color 0.2s;
    }

    .button:hover {
      background-color: #5568d3;
    }

    .form-demo {
      margin-top: 30px;
      padding: 20px;
      background-color: #f8f9fa;
      border-radius: 8px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎯 Customerlabs Action Recorder Widget - About <a href="/index.html" style="float: right; color: #667eea; text-decoration: none;">Home</a></h1>
    <p class="subtitle">Test the embeddable event tracking configuration widget</p>
    <img src="./banner.png" alt="Customerlabs Banner" style="max-width: 100%;">
  </div>

  <!-- Widget Loader Script -->
  <script src="./build/index.js"></script>
</body>

</html>
